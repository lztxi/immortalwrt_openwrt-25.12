# Redmi AX6S (MT7622 / 256MB RAM / 千兆) 家庭场景调优
# 随固件打包, 可在 /etc/sysctl.d/99-ax6s-tuning.conf 直接修改

# 连接跟踪表: 默认偏小, 家庭多设备 + BT/PT 场景容易打满
# 65536 条约占用 20MB 内存, 256MB 内存可承受
net.netfilter.nf_conntrack_max=65536

# ZRam 已启用, 提高换出倾向, 让冷页进压缩内存而不是触发 OOM
vm.swappiness=100

# 网卡接收队列, 千兆突发流量下减少丢包
net.core.netdev_max_backlog=2048

# 启用 BBR (内核已内置 CONFIG_TCP_CONG_BBR, 需要 cubic 时把下行改成 cubic)
net.ipv4.tcp_congestion_control=bbr

# 注意: 这里刻意不写 net.ipv6.conf.all.forwarding=1
# 全局开启会让接口忽略 RA, 可能破坏 WAN 侧 IPv6 获取, 交给 netifd 按接口管理更稳
